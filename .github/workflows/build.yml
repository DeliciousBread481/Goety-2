name: Build Goety-2  
  
on:  
  push:  
    branches: [ "2.5.36.1-1.20-test" ]  
  pull_request:  
    branches: [ "2.5.36.1-1.20-test" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
  
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
        
      - name: Check Maven accessibility  
        run: |  
          echo "Checking MinecraftForge Maven..."  
          curl -sI "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.33/forge-1.20.1-47.2.33-userdev.jar" || echo "MinecraftForge Maven UNREACHABLE"  
          echo "Checking NeoForged Maven..."  
          curl -sI "https://maven.neoforged.net/releases/net/minecraftforge/forge/1.20.1-47.2.33/forge-1.20.1-47.2.33-userdev.jar" || echo "NeoForged Maven UNREACHABLE"
  
      - name: Build with Gradle  
        run: ./gradlew build  
  
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: Goety-2  
          path: build/libs/*.jar  
          if-no-files-found: error